<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#94a3b8">E2E Test Flow — Meta Pixel + Checkout · Playwright</text>

  <!-- Step 1: Playwright inicia -->
  <rect x="240" y="50" width="200" height="52" rx="8" fill="#112240" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="340" y="71" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#e2e8f0">Playwright inicia</text>
  <text x="340" y="89" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">page.goto(AD_CREATIVE_URL)</text>

  <!-- Arrow 1→2 -->
  <line x1="340" y1="102" x2="340" y2="128" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 2: PageView (blue) -->
  <rect x="240" y="128" width="200" height="52" rx="8" fill="#0f2744" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="340" y="149" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#38bdf8">PageView ✓</text>
  <text x="340" y="167" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">Meta Pixel: PageView</text>

  <!-- Arrow 2→3 -->
  <line x1="340" y1="180" x2="340" y2="206" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 3: Scroll -->
  <rect x="240" y="206" width="200" height="52" rx="8" fill="#112240" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="340" y="227" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#e2e8f0">Scroll da página</text>
  <text x="340" y="245" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">window.scrollBy · behavior: smooth</text>

  <!-- Arrow 3→4 -->
  <line x1="340" y1="258" x2="340" y2="284" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 4: Clique CTA -->
  <rect x="240" y="284" width="200" height="52" rx="8" fill="#112240" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="340" y="305" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#e2e8f0">Clique no CTA</text>
  <text x="340" y="323" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">locator('[data-cta]').click()</text>

  <!-- Arrow 4→5 -->
  <line x1="340" y1="336" x2="340" y2="362" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 5: InitiateCheckout (blue) -->
  <rect x="240" y="362" width="200" height="52" rx="8" fill="#0f2744" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="340" y="383" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#38bdf8">InitiateCheckout ✓</text>
  <text x="340" y="401" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">Meta Pixel: IC disparado</text>

  <!-- Arrow 5→6 -->
  <line x1="340" y1="414" x2="340" y2="440" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 6: Preenche checkout -->
  <rect x="240" y="440" width="200" height="52" rx="8" fill="#112240" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="340" y="461" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#e2e8f0">Preenche checkout</text>
  <text x="340" y="479" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">nome · email · CPF · cartão</text>

  <!-- Arrow 6→7 -->
  <line x1="340" y1="492" x2="340" y2="518" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 7: Relatório (green) -->
  <rect x="240" y="518" width="200" height="52" rx="8" fill="#0a2318" stroke="#22c55e" stroke-width="0.8"/>
  <text x="340" y="539" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#22c55e">Relatório ✓</text>
  <text x="340" y="557" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">PageView + IC + Screenshot</text>

  <!-- Left side label: Pixel events -->
  <text x="110" y="152" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">Pixel</text>
  <text x="110" y="166" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">events</text>
  <line x1="240" y1="154" x2="148" y2="154" stroke="#475569" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>
  <line x1="240" y1="386" x2="148" y2="386" stroke="#475569" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>
  <text x="110" y="382" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">facebook</text>
  <text x="110" y="396" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">.com/tr/</text>

  <!-- Right side label: intercept -->
  <text x="568" y="226" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">request</text>
  <text x="568" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">intercept</text>
  <line x1="440" y1="232" x2="530" y2="232" stroke="#475569" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>
  <line x1="440" y1="310" x2="530" y2="242" stroke="#475569" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>
  <line x1="440" y1="466" x2="530" y2="250" stroke="#475569" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>

  <!-- Step numbers -->
  <circle cx="225" cy="76" r="10" fill="#0f2744" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="225" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">1</text>
  <circle cx="225" cy="154" r="10" fill="#0f2744" stroke="#38bdf8" stroke-width="0.5"/>
  <text x="225" y="158" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8">2</text>
  <circle cx="225" cy="232" r="10" fill="#0f2744" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="225" y="236" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">3</text>
  <circle cx="225" cy="310" r="10" fill="#0f2744" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="225" y="314" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">4</text>
  <circle cx="225" cy="388" r="10" fill="#0f2744" stroke="#38bdf8" stroke-width="0.5"/>
  <text x="225" y="392" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8">5</text>
  <circle cx="225" cy="466" r="10" fill="#0f2744" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="225" y="470" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">6</text>
  <circle cx="225" cy="544" r="10" fill="#0a2318" stroke="#22c55e" stroke-width="0.5"/>
  <text x="225" y="548" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#22c55e">7</text>
</svg>
